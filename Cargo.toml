[workspace]
resolver = "3"
members = [
    "crates/decode",
    "crates/sanitize",
    "crates/provider",
    "crates/server",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/baileyb/cardano-mcp"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"

[profile.release]
overflow-checks = true
