# cargo-deny configuration — fail-closed. See CLAUDE.md (Rust standards).

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # Modern MIT-class permissive license (Blue Oak Council "gold").
    "BlueOak-1.0.0",
    # Data license on webpki-roots' Mozilla CA bundle; required by rustls.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal path dependencies have no version by design; this
# permits them (private crates only) while still denying registry wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
