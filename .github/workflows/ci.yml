name: ci

on:
  push:
    branches: [main]
    paths: ["**.rs", "**/Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "deny.toml", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["**.rs", "**/Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "deny.toml", ".github/workflows/ci.yml"]

permissions: {}

jobs:
  test:
    name: fmt + clippy + test (pinned toolchain)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.96.0"
      - run: cargo check --workspace --locked

  deny:
    name: cargo-deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # The action's container must install the same toolchain
          # rust-toolchain.toml pins, or rustup refuses to run.
          rust-version: "1.97.1"

  coverage:
    name: coverage (report-only, never a gate)
    runs-on: ubuntu-latest
    # Report-only: a coverage-tool hiccup must never block a merge.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-llvm-cov
      - name: measure and publish to job summary
        run: |
          {
            echo '## Coverage (report-only)'
            echo '```text'
            cargo llvm-cov --workspace --locked --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  fuzz-build:
    name: fuzz targets typecheck (drift guard)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Type-check only: this catches decode/sanitize API drift in the fuzz
      # targets without cargo-fuzz's sanitizer/nightly/musl build machinery.
      - name: typecheck all fuzz targets (catches API drift)
        run: cargo check --manifest-path fuzz/Cargo.toml --bins

  boundaries:
    name: crate dependency allowlist (ADR-enforced)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: decode and sanitize must have no I/O in their transitive tree
        run: |
          # Transitive check (normal edges only): an I/O crate must not
          # appear anywhere below decode or sanitize, directly or indirectly.
          banned='^(tokio|reqwest|hyper|h2|mio|socket2|hickory-[a-z]+|trust-dns-[a-z]+|async-std|smol|ureq|curl|isahc|surf|quinn|io-uring|rustls|native-tls|openssl|actix|axum|warp|tide) v'
          fail=0
          for crate in decode sanitize; do
            tree=$(cargo tree -p "cardano-mcp-$crate" --edges normal --prefix none --locked)
            hit=$(echo "$tree" | grep -iE "$banned" || true)
            if [ -n "$hit" ]; then
              echo "::error::I/O crate in transitive tree of cardano-mcp-$crate:"
              echo "$hit"
              fail=1
            else
              echo "cardano-mcp-$crate transitive tree clean"
            fi
          done
          exit $fail
