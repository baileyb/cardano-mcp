name: ci

on:
  push:
    branches: [main]
    paths: ["**.rs", "**/Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "deny.toml", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["**.rs", "**/Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "deny.toml", ".github/workflows/ci.yml"]

permissions: {}

jobs:
  test:
    name: fmt + clippy + test (pinned toolchain)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.96.0"
      - run: cargo check --workspace --locked

  deny:
    name: cargo-deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # The action's container must install the same toolchain
          # rust-toolchain.toml pins, or rustup refuses to run.
          rust-version: "1.97.1"

  boundaries:
    name: crate dependency allowlist (ADR-enforced)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: decode and sanitize must have no I/O dependencies
        run: |
          for crate in decode sanitize; do
            deps=$(sed -n '/^\[dependencies\]/,/^\[/p' "crates/$crate/Cargo.toml" | grep -E '^[a-zA-Z0-9_-]+\s*=' || true)
            banned=$(grep -E '^(reqwest|hyper|tokio|async-std|smol|ureq|curl|isahc|surf|actix|axum|warp|tide|std?::fs)' <<< "$deps" || true)
            if [ -n "$banned" ]; then
              echo "::error::I/O dependency found in crates/$crate: $banned"
              exit 1
            fi
            echo "crates/$crate dependency list clean"
          done
