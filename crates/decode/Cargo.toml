# INVARIANT: this crate must contain no I/O dependencies (no HTTP client,
# no async runtime, no filesystem crates). "Decode does no I/O" is enforced
# by this dependency list; CI asserts it. See ARCHITECTURE.md.
[package]
name = "cardano-mcp-decode"
description = "Chain-data parsing and narration for cardano-mcp. No I/O by construction."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Pure Cardano primitives (address parsing, blake2b) — the workspace's
# foundational chain library; no I/O.
pallas-addresses = "1.1.1"
pallas-crypto = "1.1.1"
# CIP-14 fingerprints are bech32-encoded; pure encoding crate.
bech32 = "0.12.0"
# Hex encode/decode for policy IDs and asset names; pure.
hex = "0.4.3"
# Typed error derives; no runtime.
thiserror = "2.0.20"

[dev-dependencies]
# Property testing for round-trip invariants (repo testing convention).
proptest = "1.11.0"

[lints]
workspace = true
