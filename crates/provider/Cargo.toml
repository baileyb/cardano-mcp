[package]
name = "cardano-mcp-provider"
description = "ChainProvider trait and backends for cardano-mcp (Blockfrost-compatible HTTP)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# HTTP client for Blockfrost-compatible APIs. rustls TLS (no system
# OpenSSL) via the default aws-lc-rs provider, a build-time C compile
# through aws-lc-sys. HTTP/3 is off, so quinn is absent from this crate's
# dependency tree.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
# Response DTO deserialization.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
# Typed errors.
thiserror = "2.0.20"

[dev-dependencies]
# Drives the async provider against a hand-rolled local HTTP server in the
# transport tests; no network, no third-party mock dependency.
tokio = { version = "1.53.1", features = ["rt", "macros"] }

[lints]
workspace = true
