[package]
name = "cardano-mcp"
description = "Cardano MCP server: decoded chain intelligence for AI agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
cardano-mcp-decode = { path = "../decode" }
cardano-mcp-sanitize = { path = "../sanitize" }
cardano-mcp-provider = { path = "../provider" }
# MCP server SDK: server role, tool macros, and the stdio transport.
rmcp = { version = "3.1.2", default-features = false, features = ["server", "macros", "transport-io"] }
# JSON Schema derive for tool parameter structs (rmcp re-exports at runtime).
schemars = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
# Async runtime; rmcp spawns tasks, so a multi-thread runtime is used.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
# Error context at the binary edge only (library crates use thiserror).
anyhow = "1.0"
# Typed tool errors.
thiserror = "2.0.20"

[dev-dependencies]
# Hex-encode hostile fixture bytes in tests.
hex = "0.4.3"
# In-memory MCP client to drive the server in an integration test.
rmcp = { version = "3.1.2", default-features = false, features = ["client"] }
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["io-util", "time"] }

[lints]
workspace = true
